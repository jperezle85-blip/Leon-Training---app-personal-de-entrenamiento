<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Juan Training</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;background:#f4f4f5;color:#111}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:#111;color:white;position:sticky;top:0;z-index:3}
h1{font-size:25px;margin:0 0 3px}.sub{opacity:.65;font-size:13px}
main{max-width:760px;margin:auto;padding:16px 16px 100px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #00000012}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.muted{color:#707070}.big{font-size:30px;font-weight:750}
button,input,select{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:#111;color:white;font-weight:650}button.secondary{background:#e8e8ea;color:#111}button.danger{background:#eee;color:#b00020}.full{width:100%}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;background:white}
label{font-size:12px;color:#666;display:block;margin:9px 0 5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:7px 6px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:5}
.tabs button{background:transparent;color:#666;padding:6px 3px;font-size:12px}.tabs button.active{color:#111;font-weight:800}
.exercise{border-top:1px solid #eee;padding:14px 0}.setrow{display:grid;grid-template-columns:45px 1fr 1fr 1fr 42px;gap:6px;align-items:center;margin:7px 0}.setrow span{font-size:12px;color:#666}
.check{height:42px;border-radius:10px;padding:0;background:#eee;color:#111}.check.done{background:#111;color:white}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat .card{margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:85px;background:#111;color:white;padding:10px 15px;border-radius:12px;display:none;z-index:9}
.calendar{padding:12px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekdays{text-align:center;color:#777;font-size:12px;margin-bottom:6px}.day{min-height:48px;padding:5px;background:#f1f1f3;color:#111;position:relative}.day span{display:block;font-size:9px;margin-top:1px}.hasWorkout{background:#111;color:#fff}.hasPlan{outline:2px solid #888;outline-offset:-2px}.todayDay{outline:2px solid #555;outline-offset:1px}.planBox{border-top:1px solid #eee;padding:12px 0}.planBox button{margin-top:8px}</style>
</head>
<body>
<header><h1>Juan Training</h1><div class="sub">Tu entrenamiento. Tus datos. Tu progreso.</div></header>
<main id="app"></main>
<nav class="tabs">
<button data-tab="today">☀️<br>Hoy</button>
<button data-tab="train">🏋️<br>Entrenar</button>
<button data-tab="history">🗓️<br>Historial</button>
<button data-tab="progress">📈<br>Progreso</button>
</nav>
<div id="toast"></div>
<script>
const KEY="juan-training-web-v1";
const defaults=["Sentadilla","Peso muerto","Press banca","Press militar","Dominadas","Remo con barra","Fondos","L-sit","Running","Bicicleta"];
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{exercises:defaults.map((name,i)=>({id:crypto.randomUUID(),name,category:i<2?"Piernas":i<4?"Empuje":i<7?"Tirón":i<8?"Core":"Cardio"})),workouts:[],plans:[]};
let calendarDate=null, planningDate=null, tab="today", current={title:"Entrenamiento",date:new Date().toISOString(),exercises:[]}, timer=null, remaining=0;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1500)}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function vol(w){return w.exercises.flatMap(x=>x.sets).filter(s=>s.done).reduce((a,s)=>a+s.reps*s.weight,0)}
function render(){
document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
let a=document.getElementById("app");
if(tab==="today") today(a); if(tab==="train") train(a); if(tab==="history") history(a); if(tab==="progress") progress(a);
}
function today(a){
let last=db.workouts[0], total=db.workouts.reduce((s,w)=>s+vol(w),0);
a.innerHTML=`<div class="card"><div class="muted">HOY</div><div class="big">Tu sesión</div><p class="muted">${last?esc(last.title):"Todavía no has registrado ningún entrenamiento."}</p><button class="full" onclick="tab='train';render()">EMPEZAR ENTRENAMIENTO</button></div>
<div class="stat"><div class="card"><div class="muted">Sesiones</div><div class="big">${db.workouts.length}</div></div><div class="card"><div class="muted">Volumen</div><div class="big">${Math.round(total)} kg</div></div></div>
<div class="card"><h3>Última sesión</h3>${last?`<b>${esc(last.title)}</b><p class="muted">${new Date(last.date).toLocaleString("es-ES")} · ${Math.round(vol(last))} kg</p>`:"Crea tu primera sesión desde Entrenar."}</div>`;
}
function train(a){
a.innerHTML=`<div class="card"><label>Nombre de la sesión</label><input id="title" value="${esc(current.title)}"></div>
<div id="exercises">${current.exercises.map((x,i)=>exerciseHTML(x,i)).join("")}</div>
<div class="card"><button class="secondary full" onclick="picker()">＋ Añadir ejercicio</button></div>
<div class="card"><button class="full" onclick="finishWorkout()">${planningDate?"GUARDAR PLANIFICACIÓN":"GUARDAR ENTRENAMIENTO"}</button></div>
<div class="card"><button class="secondary full" onclick="rest(120)">⏱ Iniciar descanso 2:00</button><div id="timer" class="big" style="text-align:center;margin-top:8px"></div></div>`;
}
function exerciseHTML(x,i){
return `<div class="card exercise"><div class="row between"><h3>${esc(x.name)}</h3><button class="danger" onclick="removeExercise(${i})">Eliminar</button></div>
${x.sets.map((s,j)=>`<div class="setrow"><span>Serie ${j+1}</span><input type="number" inputmode="numeric" value="${s.reps}" onchange="setVal(${i},${j},'reps',this.value)"><input type="number" inputmode="decimal" value="${s.weight}" onchange="setVal(${i},${j},'weight',this.value)"><input type="number" inputmode="decimal" placeholder="RPE" value="${s.rpe??''}" onchange="setVal(${i},${j},'rpe',this.value)"><button class="check ${s.done?'done':''}" onclick="toggleSet(${i},${j})">${s.done?'✓':'○'}</button></div>`).join("")}
<button class="secondary" onclick="addSet(${i})">＋ Serie</button> <button class="secondary" onclick="rest(90)">Descansar 1:30</button></div>`
}
function picker(){
let options=db.exercises.map((e,i)=>`<button class="secondary full" style="margin:5px 0;text-align:left" onclick="addExercise(${i})">${esc(e.name)} <small class="muted">· ${esc(e.category)}</small></button>`).join("");
document.getElementById("app").insertAdjacentHTML("beforeend",`<div id="modal" style="position:fixed;inset:0;background:#0007;z-index:8;padding:30px 16px"><div class="card" style="max-width:650px;margin:40px auto;max-height:80vh;overflow:auto"><div class="row between"><h2>Añadir ejercicio</h2><button onclick="modal.remove()">Cerrar</button></div>${options}<hr><button class="secondary full" onclick="newExercise()">＋ Crear ejercicio</button></div></div>`);
}
function addExercise(i){current.exercises.push({name:db.exercises[i].name,sets:[{reps:8,weight:0,rpe:null,done:false},{reps:8,weight:0,rpe:null,done:false},{reps:8,weight:0,rpe:null,done:false},{reps:8,weight:0,rpe:null,done:false}]});modal.remove();render()}
function newExercise(){let name=prompt("Nombre del ejercicio");if(!name)return;let category=prompt("Categoría","Fuerza")||"Fuerza";let e={id:crypto.randomUUID(),name,category};db.exercises.push(e);save();modal.remove();addExercise(db.exercises.length-1)}
function removeExercise(i){current.exercises.splice(i,1);render()}
function addSet(i){current.exercises[i].sets.push({reps:8,weight:0,rpe:null,done:false});render()}
function setVal(i,j,k,v){current.exercises[i].sets[j][k]=k==="rpe"?(v===""?null:Number(v)):Number(v)}
function toggleSet(i,j){current.exercises[i].sets[j].done=!current.exercises[i].sets[j].done;render()}
function finishWorkout(){
  current.title=document.getElementById("title").value||"Entrenamiento";
  if(planningDate && !current.planId){
    db.plans.push({id:crypto.randomUUID(),date:planningDate,title:current.title,exercises:JSON.parse(JSON.stringify(current.exercises))});
    save(); toast("Planificación guardada");
    planningDate=null; current={title:"Entrenamiento",date:new Date().toISOString(),exercises:[]};
    tab="history"; setTimeout(render,400); return;
  }
  current.date=new Date().toISOString();
  db.workouts.unshift(JSON.parse(JSON.stringify(current)));
  if(current.planId){db.plans=db.plans.filter(p=>p.id!==current.planId)}
  save(); toast("Entrenamiento guardado");
  planningDate=null; current={title:"Entrenamiento",date:new Date().toISOString(),exercises:[]};
  tab="history"; setTimeout(render,400);
}
function history(a){
  if(!calendarDate) calendarDate=new Date(new Date().getFullYear(),new Date().getMonth(),1);
  const y=calendarDate.getFullYear(), m=calendarDate.getMonth();
  const monthName=calendarDate.toLocaleDateString("es-ES",{month:"long",year:"numeric"});
  const offset=(new Date(y,m,1).getDay()+6)%7, days=new Date(y,m+1,0).getDate();
  let cells=[];
  for(let i=0;i<offset;i++) cells.push("<div></div>");
  for(let d=1;d<=days;d++){
    const key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const done=db.workouts.filter(w=>w.date.slice(0,10)===key);
    const planned=db.plans.filter(p=>p.date===key);
    const today=new Date().toISOString().slice(0,10)===key;
    cells.push(`<button class="day ${today?"todayDay ":""}${done.length?"hasWorkout ":""}${planned.length?"hasPlan":""}" onclick="dayDetail('${key}')"><b>${d}</b>${planned.length?'<span>□</span>':''}${done.length?'<span>✓</span>':''}</button>`);
  }
  a.innerHTML=`<div class="card"><div class="row between"><button class="secondary" onclick="changeMonth(-1)">‹</button><h2 style="text-transform:capitalize;margin:0">${monthName}</h2><button class="secondary" onclick="changeMonth(1)">›</button></div></div>
  <div class="card calendar"><div class="weekdays">${["L","M","X","J","V","S","D"].map(x=>`<b>${x}</b>`).join("")}</div><div class="days">${cells.join("")}</div>
  <p class="muted" style="font-size:12px;margin:12px 2px 0">□ Planificado · ✓ Realizado</p></div>
  <div id="dayPanel"></div>`;
}
function changeMonth(delta){calendarDate.setMonth(calendarDate.getMonth()+delta);render()}
function dayDetail(key){
  const ws=db.workouts.filter(w=>w.date.slice(0,10)===key), ps=db.plans.filter(p=>p.date===key), date=new Date(key+"T12:00:00");
  const panel=document.getElementById("dayPanel");
  panel.innerHTML=`<div class="card"><div class="row between"><div><div class="muted">${date.toLocaleDateString("es-ES",{weekday:"long"})}</div><h2 style="margin:4px 0">${date.toLocaleDateString("es-ES",{day:"numeric",month:"long"})}</h2></div><button class="secondary" onclick="openPlanner('${key}')">＋ Añadir</button></div>
  ${ps.map((p,i)=>`<div class="planBox"><b>□ ${esc(p.title)}</b><div class="muted">${p.exercises.length} ejercicios</div><button class="secondary" onclick="startPlanned(${i},'${key}')">Empezar</button> <button class="danger" onclick="deletePlan('${p.id}')">Eliminar</button></div>`).join("")}
  ${ws.map(w=>`<div class="planBox"><b>✓ ${esc(w.title)}</b><div class="muted">${w.exercises.length} ejercicios · ${Math.round(vol(w))} kg</div><details><summary>Ver ejercicios</summary><p>${w.exercises.map(x=>esc(x.name)).join(" · ")}</p></details></div>`).join("")}
  ${!ps.length&&!ws.length?`<p class="muted">No hay nada planificado ni realizado este día.</p>`:""}</div>`;
}
function openPlanner(key){
  planningDate=key;
  current={title:"Entrenamiento",date:key+"T12:00:00.000Z",exercises:[]};
  tab="train"; render();
  toast("Añade los ejercicios y guarda la planificación");
}
function startPlanned(index,key){
  const p=db.plans.filter(x=>x.date===key)[index];
  current=JSON.parse(JSON.stringify({title:p.title,date:new Date().toISOString(),exercises:p.exercises}));
  current.planId=p.id; tab="train"; render();
}
function deletePlan(id){
  if(confirm("¿Eliminar esta planificación?")){db.plans=db.plans.filter(p=>p.id!==id);save();render();toast("Planificación eliminada")}
}
function progress(a){
let map={};db.workouts.forEach(w=>w.exercises.forEach(x=>x.sets.filter(s=>s.done).forEach(s=>{map[x.name]=Math.max(map[x.name]||0,s.weight)})));
let rows=Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="row between card"><b>${esc(n)}</b><span>${v} kg</span></div>`).join("");
a.innerHTML=`<div class="stat"><div class="card"><div class="muted">Sesiones</div><div class="big">${db.workouts.length}</div></div><div class="card"><div class="muted">Volumen</div><div class="big">${Math.round(db.workouts.reduce((s,w)=>s+vol(w),0))} kg</div></div></div><h3>Mejor peso registrado</h3>${rows||'<div class="card muted">Completa series para empezar a ver tus marcas.</div>'}<div class="card"><button class="secondary full" onclick="exportData()">Exportar datos</button><br><br><button class="danger full" onclick="resetData()">Borrar todos los datos</button></div>`;
}
function rest(seconds){clearInterval(timer);remaining=seconds;document.getElementById("timer")&&(document.getElementById("timer").textContent=formatTime());timer=setInterval(()=>{remaining--;let e=document.getElementById("timer");if(e)e.textContent=formatTime();if(remaining<=0){clearInterval(timer);toast("¡Descanso terminado! 🔔")}},1000)}
function formatTime(){return `${String(Math.floor(remaining/60)).padStart(2,"0")}:${String(remaining%60).padStart(2,"0")}`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="juan-training-backup.json";a.click();URL.revokeObjectURL(url)}
function resetData(){if(confirm("¿Borrar todos los entrenamientos y ejercicios?")){localStorage.removeItem(KEY);location.reload()}}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
render();
</script>
</body>
</html>
