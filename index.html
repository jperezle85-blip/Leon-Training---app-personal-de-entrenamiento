<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Juan Training</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}
header{background:#111;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:4}h1{margin:0;font-size:25px}.sub{opacity:.65;font-size:13px}
main{max-width:760px;margin:auto;padding:16px 16px 100px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0001}
button,input{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:#111;color:#fff;font-weight:650}button.secondary{background:#e8e8ea;color:#111}button.danger{background:#eee;color:#a00020}.full{width:100%}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;background:#fff}label{font-size:12px;color:#666;display:block;margin:8px 0 5px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.muted{color:#707070}.big{font-size:30px;font-weight:800}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:7px 6px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:5}
.tabs button{background:none;color:#666;padding:5px;font-size:12px}.tabs button.active{color:#111;font-weight:800}
.calendar{padding:12px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekdays{text-align:center;color:#777;font-size:12px;margin-bottom:6px}.day{min-height:52px;padding:5px;background:#eee;color:#111;position:relative}.day.plan{outline:3px solid #888;outline-offset:-3px}.day.done{background:#111;color:#fff}.day.today{box-shadow:inset 0 0 0 2px #777}.day small{display:block;font-size:9px;margin-top:3px}
.setrow{display:grid;grid-template-columns:45px 1fr 1fr 1fr 42px;gap:5px;align-items:center;margin:7px 0}.setrow span{font-size:11px;color:#666}.check{height:42px;padding:0;background:#eee;color:#111}.check.done{background:#111;color:#fff}
.plan{border-top:1px solid #eee;padding:12px 0}.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat .card{margin:0}
</style>
</head>
<body>
<header><h1>Juan Training</h1><div class="sub">Tu entrenamiento · Tu planificación · Tu progreso</div></header>
<main id="app"></main>
<nav class="tabs">
<button data-tab="today">☀️<br>Hoy</button>
<button data-tab="train">🏋️<br>Entrenar</button>
<button data-tab="planning">📅<br>Planificación</button>
<button data-tab="progress">📈<br>Progreso</button>
</nav>
<script>
const KEY="juan-training-web-v2";
const oldKey="juan-training-web-v1";
const defaults=["Sentadilla","Peso muerto","Press banca","Press militar","Dominadas","Remo con barra","Fondos","L-sit","Running","Bicicleta"];
let db=JSON.parse(localStorage.getItem(KEY)||"null");
if(!db){
  const old=JSON.parse(localStorage.getItem(oldKey)||"null");
  db=old||{exercises:[],workouts:[]};
}
db.exercises=db.exercises||defaults.map((name,i)=>({id:crypto.randomUUID(),name,category:i<2?"Piernas":i<4?"Empuje":i<7?"Tirón":i<8?"Core":"Cardio"}));
if(!db.exercises.length) db.exercises=defaults.map(name=>({id:crypto.randomUUID(),name,category:"Fuerza"}));
db.workouts=db.workouts||[]; db.plans=db.plans||[];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
save();

let tab="today", selectedDate=null, current=null;

function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function volume(w){return (w.exercises||[]).flatMap(x=>x.sets||[]).filter(s=>s.done).reduce((a,s)=>a+(Number(s.reps)||0)*(Number(s.weight)||0),0)}
function go(t){tab=t;render()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));

function render(){
document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
if(tab==="today") renderToday();
if(tab==="train") renderTrain();
if(tab==="planning") renderPlanning();
if(tab==="progress") renderProgress();
}

function renderToday(){
const a=document.getElementById("app"), last=db.workouts[0];
a.innerHTML=`<div class="card"><div class="muted">HOY</div><div class="big">Tu entrenamiento</div>
<p class="muted">${last?esc(last.title):"Todavía no tienes entrenamientos registrados."}</p>
<button class="full" onclick="startBlank()">EMPEZAR</button></div>
<div class="stat"><div class="card"><div class="muted">Sesiones</div><div class="big">${db.workouts.length}</div></div>
<div class="card"><div class="muted">Volumen</div><div class="big">${Math.round(db.workouts.reduce((a,w)=>a+volume(w),0))} kg</div></div></div>`;
}

function startBlank(){selectedDate=null;current={title:"Entrenamiento",date:new Date().toISOString(),exercises:[]};go("train")}

function renderPlanning(){
const a=document.getElementById("app");
if(!window.cal) window.cal=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const y=cal.getFullYear(),m=cal.getMonth(),name=cal.toLocaleDateString("es-ES",{month:"long",year:"numeric"});
let cells=[]; const off=(new Date(y,m,1).getDay()+6)%7, total=new Date(y,m+1,0).getDate();
for(let i=0;i<off;i++)cells.push("<div></div>");
for(let d=1;d<=total;d++){
 let key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
 let p=db.plans.filter(x=>x.date===key), w=db.workouts.filter(x=>x.date.slice(0,10)===key);
 cells.push(`<button class="day ${p.length?"plan ":""}${w.length?"done ":""}${key===new Date().toISOString().slice(0,10)?"today":""}" onclick="selectDay('${key}')"><b>${d}</b>${p.length?'<small>PLAN</small>':''}${w.length?'<small>✓</small>':''}</button>`);
}
a.innerHTML=`<div class="card"><div class="row between"><button class="secondary" onclick="month(-1)">‹</button><h2 style="text-transform:capitalize;margin:0">${name}</h2><button class="secondary" onclick="month(1)">›</button></div></div>
<div class="card calendar"><div class="weekdays">${["L","M","X","J","V","S","D"].map(x=>`<b>${x}</b>`).join("")}</div><div class="days">${cells.join("")}</div></div>
<div id="selected"></div>`;
}
function month(n){cal.setMonth(cal.getMonth()+n);renderPlanning()}
function selectDay(key){
selectedDate=key;
const d=new Date(key+"T12:00:00"), plans=db.plans.filter(x=>x.date===key), done=db.workouts.filter(x=>x.date.slice(0,10)===key);
document.getElementById("selected").innerHTML=`<div class="card"><div class="row between"><div><div class="muted">${d.toLocaleDateString("es-ES",{weekday:"long"})}</div><h2>${d.toLocaleDateString("es-ES",{day:"numeric",month:"long"})}</h2></div>
<button onclick="createPlan('${key}')">＋ Crear planificación</button></div>
${plans.map(p=>`<div class="plan"><b>□ ${esc(p.title)}</b><p class="muted">${p.exercises.length} ejercicios</p><button class="secondary" onclick="editPlan('${p.id}')">Editar</button> <button onclick="executePlan('${p.id}')">Empezar</button> <button class="danger" onclick="removePlan('${p.id}')">Eliminar</button></div>`).join("")}
${done.map(w=>`<div class="plan"><b>✓ ${esc(w.title)}</b><p class="muted">${w.exercises.length} ejercicios · ${Math.round(volume(w))} kg</p></div>`).join("")}
${!plans.length&&!done.length?'<p class="muted">Este día está libre.</p>':''}</div>`;
}
function createPlan(key){
selectedDate=key;current={title:"Entrenamiento",date:key+"T12:00:00",exercises:[],planId:null};go("train")
}
function editPlan(id){
const p=db.plans.find(x=>x.id===id); if(!p)return;
selectedDate=p.date;current=JSON.parse(JSON.stringify(p));current.planId=id;go("train")
}
function executePlan(id){
const p=db.plans.find(x=>x.id===id);if(!p)return;
current=JSON.parse(JSON.stringify(p));current.planId=id;current.date=new Date().toISOString();selectedDate=null;go("train")
}
function removePlan(id){if(confirm("¿Eliminar esta planificación?")){db.plans=db.plans.filter(p=>p.id!==id);save();renderPlanning();if(selectedDate)selectDay(selectedDate)}}

function renderTrain(){
const a=document.getElementById("app");
if(!current)startBlank();
a.innerHTML=`<div class="card"><label>Nombre</label><input id="title" value="${esc(current.title)}">
${selectedDate?`<p class="muted">Planificado para ${new Date(selectedDate+"T12:00:00").toLocaleDateString("es-ES")}</p>`:""}</div>
${current.exercises.map((x,i)=>exercise(x,i)).join("")}
<div class="card"><button class="secondary full" onclick="pickExercise()">＋ Añadir ejercicio</button></div>
<div class="card"><button class="full" onclick="saveCurrent()">${selectedDate&&!current.planId?"GUARDAR PLANIFICACIÓN":current.planId?"GUARDAR CAMBIOS":"GUARDAR ENTRENAMIENTO"}</button></div>`;
}
function exercise(x,i){return `<div class="card"><div class="row between"><h3>${esc(x.name)}</h3><button class="danger" onclick="removeEx(${i})">Eliminar</button></div>
${x.sets.map((s,j)=>`<div class="setrow"><span>${j+1}</span><input type="number" value="${s.reps}" onchange="changeSet(${i},${j},'reps',this.value)"><input type="number" value="${s.weight}" onchange="changeSet(${i},${j},'weight',this.value)"><input type="number" placeholder="RPE" value="${s.rpe??''}" onchange="changeSet(${i},${j},'rpe',this.value)"><button class="check ${s.done?'done':''}" onclick="toggle(${i},${j})">${s.done?"✓":"○"}</button></div>`).join("")}<button class="secondary" onclick="addSet(${i})">＋ Serie</button></div>`}
function pickExercise(){
let list=db.exercises.map((e,i)=>`<button class="secondary full" style="margin:4px 0;text-align:left" onclick="choose(${i})">${esc(e.name)} · ${esc(e.category)}</button>`).join("");
document.getElementById("app").insertAdjacentHTML("beforeend",`<div id="modal" style="position:fixed;inset:0;background:#0008;z-index:8;padding:25px 16px"><div class="card" style="max-width:700px;margin:30px auto;max-height:85vh;overflow:auto"><div class="row between"><h2>Ejercicios</h2><button onclick="modal.remove()">Cerrar</button></div>${list}<hr><button class="secondary full" onclick="newEx()">＋ Crear ejercicio</button></div></div>`)
}
function choose(i){current.exercises.push({name:db.exercises[i].name,sets:[newSet(),newSet(),newSet(),newSet()]});modal.remove();renderTrain()}
function newSet(){return{reps:8,weight:0,rpe:null,done:false}}
function newEx(){let n=prompt("Nombre del ejercicio");if(!n)return;let c=prompt("Categoría","Fuerza")||"Fuerza";db.exercises.push({id:crypto.randomUUID(),name:n,category:c});save();modal.remove();choose(db.exercises.length-1)}
function removeEx(i){current.exercises.splice(i,1);renderTrain()}
function addSet(i){current.exercises[i].sets.push(newSet());renderTrain()}
function changeSet(i,j,k,v){current.exercises[i].sets[j][k]=k==="rpe"?(v===""?null:Number(v)):Number(v)}
function toggle(i,j){current.exercises[i].sets[j].done=!current.exercises[i].sets[j].done;renderTrain()}
function saveCurrent(){
current.title=document.getElementById("title").value||"Entrenamiento";
if(selectedDate&&!current.planId){
 db.plans.push({id:crypto.randomUUID(),date:selectedDate,title:current.title,exercises:JSON.parse(JSON.stringify(current.exercises))});
 save();selectedDate=null;current=null;alert("Planificación guardada");go("planning");return;
}
if(current.planId&&!selectedDate){
 current.date=new Date().toISOString();db.workouts.unshift(JSON.parse(JSON.stringify(current)));db.plans=db.plans.filter(p=>p.id!==current.planId);
 save();current=null;alert("Entrenamiento realizado y guardado");go("planning");return;
}
if(current.planId&&selectedDate){
 let p=db.plans.find(p=>p.id===current.planId);if(p){p.title=current.title;p.exercises=JSON.parse(JSON.stringify(current.exercises))}
 save();current=null;alert("Planificación actualizada");go("planning");return;
}
current.date=new Date().toISOString();db.workouts.unshift(JSON.parse(JSON.stringify(current)));save();current=null;alert("Entrenamiento guardado");go("planning")
}

function renderProgress(){
const a=document.getElementById("app"),map={};db.workouts.forEach(w=>w.exercises.forEach(x=>x.sets.filter(s=>s.done).forEach(s=>map[x.name]=Math.max(map[x.name]||0,Number(s.weight)||0))));
a.innerHTML=`<div class="stat"><div class="card"><div class="muted">Sesiones</div><div class="big">${db.workouts.length}</div></div><div class="card"><div class="muted">Volumen</div><div class="big">${Math.round(db.workouts.reduce((a,w)=>a+volume(w),0))} kg</div></div></div><h3>Mejores pesos</h3>${Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="card row between"><b>${esc(n)}</b><span>${v} kg</span></div>`).join("")||'<div class="card muted">Completa sesiones para ver tu progreso.</div>'}`
}
render();
</script>
</body>
</html>
